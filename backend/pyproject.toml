[project]
name = "torque-auto-parts-backend"
version = "1.1.0"
description = "Retail auto parts FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn==0.52.1",
    "sqlalchemy==2.1.8",
    "pymysql==1.2.4",
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "pydantic-settings>=2.10,<3",
]
[tool.uv]
package = false
[dependency-groups]
dev = ["pytest==9.2.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
